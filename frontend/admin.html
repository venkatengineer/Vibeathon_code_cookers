<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RapidAid AI – Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="admin-page">

  <h1>🚨 RapidAid AI – Admin Dashboard</h1>

  <!-- STATS -->
  <div class="admin-stats">
    <div class="stat-card">
      <h2 id="total">0</h2>
      <p>Total Emergencies</p>
    </div>
    <div class="stat-card">
      <h2 id="critical">0</h2>
      <p>Critical</p>
    </div>
    <div class="stat-card">
      <h2 id="active">0</h2>
      <p>Active</p>
    </div>
  </div>

  <!-- EMERGENCY TABLE -->
  <div class="admin-table">
    <h2>Live Emergency Reports</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Category</th>
          <th>Severity</th>
          <th>Department</th>
          <th>Timestamp</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="reportTable">
        <!-- Filled by JS -->
      </tbody>
    </table>
  </div>

</div>

<script src="admin.js"></script>
</body>
</html>
