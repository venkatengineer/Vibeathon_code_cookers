<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RapidAid AI</title>

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="cursor"></div>

<div class="app">

  <!-- AI GUIDE -->
  <div class="ai-guide">
    <lottie-player
      src="https://assets10.lottiefiles.com/packages/lf20_kkflmtur.json"
      background="transparent"
      speed="1"
      loop
      autoplay>
    </lottie-player>

    <div class="ai-dialogue" id="ai-text">
      I’m RapidAid AI. I’ll guide you step by step.
      Please describe what’s happening.
    </div>
  </div>

  <!-- USER INPUT -->
  <div class="input-card">
    <h2>Emergency Report</h2>

    <textarea id="description" placeholder="Describe the emergency in detail..."></textarea>

    <div class="upload-box">
      <p>Upload evidence (images / video)</p>
      <input type="file" id="media" multiple>
    </div>

    <button onclick="analyze()">Send for Analysis</button>
  </div>

  <!-- LIVE AI INTELLIGENCE -->
  <div class="intel-card" id="intel">

    <h2>Live AI Intelligence</h2>

    <div class="intel-item">
      <span>Status</span>
      <strong id="ai-status">Idle</strong>
    </div>

    <div class="intel-item">
      <span>Detected Keywords</span>
      <strong id="keywords">—</strong>
    </div>

    <div class="intel-item">
      <span>Media Evidence</span>
      <strong id="media-status">None</strong>
    </div>

    <div class="intel-item">
      <span>Departments</span>
      <strong id="departments">—</strong>
    </div>

    <div class="intel-item">
      <span>Priority</span>
      <strong id="priority">—</strong>
    </div>

    <div class="intel-item">
      <span>Estimated Response</span>
      <strong id="eta">—</strong>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
