<!DOCTYPE html>
<html>
<head>
<title>Raise Emergency Complaint</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2c2c54);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

.container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    width: 420px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    animation: fadeIn 0.8s ease;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
}

input, textarea {
    width: 100%;
    padding: 12px 15px;
    margin: 12px 0;
    border-radius: 12px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 14px;
    transition: 0.3s ease;
}

input:focus, textarea:focus {
    background: rgba(255,255,255,0.2);
    transform: scale(1.03);
}

textarea {
    resize: none;
    height: 100px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(255, 75, 43, 0.6);
}

.redirect-box {
    margin-top: 20px;
    text-align: center;
    display: none;
    animation: fadeInUp 0.6s ease forwards;
}

.redirect-box a {
    display: block;
    margin: 8px 0;
    padding: 10px;
    border-radius: 10px;
    text-decoration: none;
    color: white;
    background: rgba(255,255,255,0.1);
    transition: 0.3s ease;
}

.redirect-box a:hover {
    background: rgba(255,255,255,0.25);
    transform: scale(1.05);
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
    <h2>🚨 Raise Emergency Complaint</h2>

    <form id="complaintForm" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Title" required>
        <textarea name="description" placeholder="Describe the emergency" required></textarea>
        <input type="file" name="image">
        <button type="submit">Submit</button>
    </form>

    <!-- Redirect Section -->
    <div class="redirect-box" id="redirectBox">
        <p>✅ Complaint Submitted Successfully</p>
        <a href="/police">🚓 Go to Police Dashboard</a>
        <a href="/ambulance">🚑 Go to Ambulance Dashboard</a>
        <a href="/firestation">🚒 Go to Firestation Dashboard</a>
    </div>
</div>

<script>
document.getElementById("complaintForm").onsubmit = async function(e) {
    e.preventDefault();
    const formData = new FormData(this);

    await fetch("http://127.0.0.1:5000/file-complaint", {
        method: "POST",
        body: formData
    });

    document.getElementById("complaintForm").reset();
    document.getElementById("redirectBox").style.display = "block";
};
</script>

</body>
</html>
