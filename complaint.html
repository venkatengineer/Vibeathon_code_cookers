<!DOCTYPE html>
<html>
<head>
<title>Raise Emergency Complaint</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2c2c54);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

/* Glass Card */
.container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    width: 400px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    animation: fadeIn 0.8s ease;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
    letter-spacing: 1px;
    animation: slideDown 0.8s ease;
}

input, textarea {
    width: 100%;
    padding: 12px 15px;
    margin: 12px 0;
    border-radius: 12px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 14px;
    transition: 0.3s ease;
}

input:focus, textarea:focus {
    background: rgba(255,255,255,0.2);
    transform: scale(1.03);
}

textarea {
    resize: none;
    height: 100px;
}

input[type="file"] {
    padding: 8px;
    cursor: pointer;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(255, 75, 43, 0.6);
}

button:active {
    transform: scale(0.97);
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Subtle floating animation */
.container:hover {
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
    100% { transform: translateY(0px); }
}
</style>
</head>

<body>

<div class="container">
    <h2>🚨 Raise Emergency Complaint</h2>

    <form id="complaintForm" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Title" required>
        <textarea name="description" placeholder="Describe the emergency" required></textarea>
        <input type="file" name="image">
        <button type="submit">Submit</button>
    </form>
</div>

<script>
document.getElementById("complaintForm").onsubmit = async function(e) {
    e.preventDefault();
    const formData = new FormData(this);

    await fetch("http://127.0.0.1:5000/file-complaint", {
        method: "POST",
        body: formData
    });

    alert("Complaint Submitted!");
};
</script>

</body>
</html>
